[env:rpipico2w]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico2w
framework = arduino
board_build.core = earlephilhower
platform_packages =
    framework-arduino-pico @ https://github.com/earlephilhower/arduino-pico.git
monitor_speed = 115200
build_flags =
    -DPIO_FRAMEWORK_ARDUINO_ENABLE_BLUETOOTH
    ; Panel layout: 11 (6+5, default) or 14 (7+7). Must match your .anim files.
    ; -DPROTOGEN_LAYOUT=14
lib_deps =
    BTstackLib
    adafruit/Adafruit NeoPixel
    SD