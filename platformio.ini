[env:rpipico2w]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico2w
framework = arduino
board_build.core = earlephilhower
platform_packages =
    framework-arduino-pico @ https://github.com/earlephilhower/arduino-pico.git
monitor_speed = 115200
build_flags =
    -DPIO_FRAMEWORK_ARDUINO_ENABLE_BLUETOOTH
; Flash file system that keeps the display.json copied from the SD card.
; Flashing a new firmware .uf2 does not erase it.
board_build.filesystem_size = 0.5m
lib_deps =
    BTstackLib
    adafruit/Adafruit NeoPixel
    adafruit/Adafruit Protomatter@^1.7.1
    adafruit/Adafruit GFX Library
    bblanchon/ArduinoJson@^7.4.2
    adafruit/Adafruit BusIO
    https://github.com/adafruit/Adafruit_HUSB238.git
    SD; Adafruit Protomatter's library.properties pulls in libraries for its
; examples. They are not used, and the SdFat fork clashes with the core's SD
; library, so keep them out of the build.
lib_ignore =
    SdFat - Adafruit Fork
    Adafruit SPIFlash
    Adafruit TinyUSB Library
    AnimatedGIF
    Adafruit PixelDust
    Adafruit LIS3DH
    Adafruit Unified Sensor
    MIDI Library
