name: PlatformIO CI
on:
  push:
    branches: [ "master", "Mk3-Protogen", "Mk2-Protogen" ]
    paths:
      - 'src/**'
      - 'platformio.ini'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [ "master" ]
    paths:
      - 'src/**'
      - 'platformio.ini'
      - '.github/workflows/build.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # allow the workflow to publish releases
    strategy:
      matrix:
        layout: [14]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO Core
        run: pip install platformio
      - name: Build firmware (Layout ${{ matrix.layout }})
        env:
          PLATFORMIO_BUILD_FLAGS: -DPROTOGEN_LAYOUT=${{ matrix.layout }}
        run: pio run
      - name: Upload firmware (Layout ${{ matrix.layout }})
        uses: actions/upload-artifact@v4
        with:
          name: ProtoFace-firmware-layout-${{ matrix.layout }}-${{ github.sha }}
          path: |
            .pio/build/rpipico2w/firmware.uf2
            .pio/build/rpipico2w/firmware.elf
          if-no-files-found: warn

      - name: Stage release assets
        if: github.event_name == 'push'
        run: |
          mkdir -p dist
          cp .pio/build/rpipico2w/firmware.uf2 \
             "dist/ProtoFace-${{ github.ref_name }}-layout${{ matrix.layout }}.uf2"
          cp .pio/build/rpipico2w/firmware.elf \
             "dist/ProtoFace-${{ github.ref_name }}-layout${{ matrix.layout }}.elf"

      - name: Publish rolling "latest" release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}-latest
        run: |
          # Recreate the per-branch rolling release so its tag and assets
          # always point at the newest successful build.
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" dist/* \
            --target "$GITHUB_SHA" \
            --title "ProtoFace ${{ github.ref_name }} — latest build" \
            --prerelease \
            --notes "Automated build of \`${{ github.ref_name }}\` @ \`${{ github.sha }}\` (layout ${{ matrix.layout }}).

          **Flash:** hold **BOOTSEL** on the Pico 2 W while plugging in USB, then copy the \`.uf2\` onto the \`RPI-RP2\` drive that appears."
