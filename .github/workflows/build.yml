name: Firmware build

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Firmware build (layout ${{ matrix.layout }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        layout: [11, 14]
    steps:
      - uses: actions/checkout@v4

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PlatformIO
        run: pip install platformio

      # Builds without src/fallback_anim.h (it is gitignored), using the
      # built-in fallback frame.
      - name: Build (PROTOGEN_LAYOUT=${{ matrix.layout }})
        env:
          PLATFORMIO_BUILD_FLAGS: -DPROTOGEN_LAYOUT=${{ matrix.layout }}
        run: pio run

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: ProtoFace-layout-${{ matrix.layout }}
          path: .pio/build/rpipico2w/firmware.uf2
          if-no-files-found: error
