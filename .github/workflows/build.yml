name: Firmware build

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # One firmware for every helmet: the display comes from display.json.
    name: Firmware build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build
        run: pio run

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: ProtoFace
          path: .pio/build/rpipico2w/firmware.uf2
          if-no-files-found: error

  host-tests:
    # Display-config code, tested on the runner (no Pico needed)
    name: Display config tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch ArduinoJson
        run: git clone --depth 1 --branch v7.4.2 https://github.com/bblanchon/ArduinoJson tests/host/ArduinoJson
      - name: Run
        run: make -C tests/host
