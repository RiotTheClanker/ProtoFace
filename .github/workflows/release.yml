name: Release

# Builds the single ProtoFace firmware and publishes a GitHub release with the
# .uf2 and the display.json presets/examples.
#
# Start it by pushing a version tag (e.g. V7.0), or from the Actions tab with
# "Run workflow", entering the version:
#   - on master: a normal release; the version must equal FIRMWARE_VERSION.
#   - on dev: a test build; the version must start with FIRMWARE_VERSION and
#     contain "-dev", e.g. V7.0-dev.1.
# A version with a "-" in it (V7.0-dev.1, V7.0-rc1) becomes a DRAFT prerelease:
# only repo members can see it, so the website never picks it up. Publish it
# by hand on the Releases page if it should become public.
on:
  push:
    tags: [ 'V*' ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (master: e.g. V7.0 = FIRMWARE_VERSION; dev: e.g. V7.0-dev.1)'
        required: true

permissions:
  contents: read

env:
  VERSION: ${{ inputs.version || github.ref_name }}

jobs:
  build:
    name: Build firmware
    # Manual releases only from master (release) or dev (prerelease)
    if: github.event_name == 'push' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Check the version against FIRMWARE_VERSION
        run: |
          fw=$(sed -n 's/^#define FIRMWARE_VERSION "\(.*\)"/\1/p' src/main.cpp)
          echo "FIRMWARE_VERSION=$fw, release version=$VERSION"
          if [ "$GITHUB_REF" = "refs/heads/dev" ]; then
            case "$VERSION" in "$fw"*) ;; *) echo "::error::$VERSION must start with $fw"; exit 1;; esac
            case "$VERSION" in *-dev*) ;; *) echo "::error::dev releases need -dev in the version"; exit 1;; esac
          elif [ "$VERSION" != "$fw" ]; then
            echo "::error::$VERSION must equal FIRMWARE_VERSION ($fw)"; exit 1
          fi

      - name: Build
        run: pio run

      - name: Collect release files
        run: |
          mkdir -p dist
          cp .pio/build/rpipico2w/firmware.uf2 "dist/ProtoFace-${VERSION}.uf2"
          cp displays/*.json displays/examples/*.json dist/

      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: release
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A release made by hand on the Releases page (which also pushes the
          # tag and starts this workflow) already exists: add the files to it
          # instead of failing, and keep its title and notes.
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" dist/* --clobber
            exit 0
          fi
          case "$VERSION" in
            *-*) pre=true; set -- --draft --prerelease --latest=false ;;
            *)   pre=false; set -- ;;
          esac
          notes="docs/releases/${VERSION}.md"
          if [ -f "$notes" ]; then set -- "$@" --notes-file "$notes"
          elif $pre && [ -f docs/releases/dev.md ]; then set -- "$@" --notes-file docs/releases/dev.md
          else set -- "$@" --generate-notes; fi
          # --target creates the tag on this commit when it doesn't exist yet
          # (manual runs); for a pushed tag it already points here.
          gh release create "$VERSION" dist/* \
            --title "ProtoFace ${VERSION}" \
            --target "$GITHUB_SHA" "$@"
